name: Branch inicia tarefa

on:
  create

jobs:
  set-em-andamento:
    if: github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - name: Move a issue pra Em Andamento
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_TOKEN_WORKFLOW }}
        run: |
          NUM=$(echo "${{ github.event.ref }}" | grep -oE '^[0-9]+' || true)
          if [ -z "$NUM" ]; then
            echo "Branch '${{ github.event.ref }}' nao comeca com numero de issue, ignorando."
            exit 0
          fi
          ITEM_ID=$(gh project item-list 4 --owner "@me" --format json -L 100 \
            -q ".items[] | select(.content.number == $NUM) | .id")
          if [ -z "$ITEM_ID" ]; then
            echo "Issue #$NUM nao esta no Project, ignorando."
            exit 0
          fi
          gh project item-edit --id "$ITEM_ID" \
            --project-id "PVT_kwHOBjOJ8M4Bh2UC" \
            --field-id "PVTSSF_lAHOBjOJ8M4Bh2UCzhgwghY" \
            --single-select-option-id "47fc9ee4"
